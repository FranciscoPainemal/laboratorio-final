name: Workflow
on: 
    push:
        branches: 
            - ANALISIS-LAB
jobs: 
    SAST:
        runs-on: ubuntu-latest
        steps: 

            - name: Set up JDK 17
              uses: actions/setup-java@v2
              with:
                java-version: 17
                distribution: 'adopt'
                        
            - name: Checkout code
              uses: actions/checkout@v2
            
            # - name: build
            #   run: |
            #     chmod 777 gradlew
            #     ./gradlew build  
                
            - name: Validando proyecto con Sonar
              run: |
                set +e
                curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/projects/create' -d 'name=laboratorio-final-' -d 'project=laboratorio-final-' -d 'organization=franciscopainemal' -d 'visibility=public'
                if[ $? -ne 0]; then
                    echo "el proyecto ya existe en SonarCloud"
                    echo ":: set-output nema=proyectoExiste::1"
                else
                    echo "Proyecto creado exitosamente con SonarCloud"
                    curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/project_branches/rename' -d 'name=main' -d 'project=${{ github.event.repository.name }}'                
                fi
                set-e
