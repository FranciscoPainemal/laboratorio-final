name: Workflow 
on:
  push: 
    branches: 
      - ANALISIS-LAB

jobs:

# CONTRUCCIÓN BUILD RECURSIVO Y CRACIÓN COMO ARTEFACTO EN GITHUB
  BUILD: 
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v2

        - name: Versión de a utilizar Node.js 18 
          uses: actions/setup-node@v4
          with:
              node-version: 18

        - name: Instalando dependencias
          run: npm ci 
        
        - name: Build del repositorio
          run: npm run build

        - name: Subir build como artefacto para reutilización
          uses: actions/upload-artifact@master
          with:
              name: build-artifact
              path: |
                .next
                public
                package.json

# ANÁLISIS SAST y quiebre de pipeline
  SAST:
      needs: BUILD
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v2
        
        - name: Descargar Artefacto Build
          uses: actions/download-artifact@master
          with:
              name: build-artifact
              path: .

        - name: Validando existencia del proyecto en SonarQube
          run: |
            set +e
            curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/projects/create' -d 'name=${{github.event.repository.name}}' -d 'project=${{github.event.repository.name}}' -d 'organization=franciscopainemal' -d 'visibility=public'
            if [ $? -ne 0 ]; 
            then
                echo "el proyecto ya existe en SonarCloud"
                echo ":: set-output name=proyectoExiste::1"
            else
                echo "Proyecto ${{github.event.repository.name}} creado exitosamente con SonarCloud"
                echo "Se establece rama Main como rama por defecto"
                curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/project_branches/rename' -d 'name=main' -d 'project=${{ github.event.repository.name }}'                
            fi
            set -e 

        - name: Validando el tipo de proyecto
          run: | 
            if [ -f "package.json" ]; 
            then    
                if grep -q '"react"' package.json 
                then
                    echo "Proyecto es React."
                else   
                    echo "El proyecto no es del tipp React."
                    exit 1
                fi
            else 
                echo "No se encontró archivo."
                exit 1
            fi

        - name: Ejecutando SONARQUBE
          run: |
            npx sonar-scanner \
              -Dsonar.projectKey=${{ github.event.repository.name }} \
              -Dsonar.organization=franciscopainemal \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
              -Dsonar.branch.name=main

        - name: Validando resultados de SONARQUBE
          run: |
            issuesCritical=$(curl -s -X GET -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/issues/search?branch=main&componentKeys=${{ github.event.repository.name }}&facets=severities' | jq '.facets[0].values[2].count')
            issuesMayor=$(curl -s -X GET -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/issues/search?branch=main&componentKeys=${{ github.event.repository.name }}&facets=severities' | jq '.facets[0].values[1].count')
            issuesMinor=$(curl -s -X GET -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/issues/search?branch=main&componentKeys=${{ github.event.repository.name }}&facets=severities' | jq '.facets[0].values[0].count')
                                        
            if [ "$issuesCritical" -gt 0 ] || [ "$issuesMayor" -gt 0 ] || [ "$issuesMinor" -gt 0 ];
            then
              echo "Existen infracciones de niveles Críticas, Altas y/o Medias en el código, se aborta Pipeline en el análisis SAST"
              # exit 1
            fi

# ANÁLISIS SCA, creación de reporte y quiebre de pipeline 
  SCA:
      needs: SAST
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v2
        
        - name: Descargar Artefacto Build
          uses: actions/download-artifact@master
          with:
              name: build-artifact
              path: .
        
        - name: Dependency Check
          uses: dependency-check/Dependency-Check_Action@1.0.0 
          env: 
            JAVA_HOME: /opt/jdk
          with:
            project: '${{ github.event.repository.name }}'
            path: '.'
            format: 'ALL'
            out: 'reports'
            args: >
              --failOnCVSS 7
              --enableRetired

        - name: Generar reporte de SCA como un repositorio
          uses: actions/upload-artifact@v4
          with:
              name: dependency-check-reports
              path: ${{ github.workspace }}/reports
              
        - name: Mostrar vulnerabilidades encontradas del reporte.json
          run: |
            echo "Analizando reporte JSON..."
            REPORT="reports/dependency-check-report.json"

            if [ ! -f "$REPORT" ]; 
            then
              echo "No se encontró el reporte JSON en $REPORT"
              # exit 1
            fi

            CRITICAL=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity == "critical")] | length' "$REPORT")
            HIGH=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity == "high")] | length' "$REPORT")
            MEDIUM=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity == "moderate")] | length' "$REPORT")
            
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] ||  [ "$MEDIUM" -gt 0 ];
            then
              echo "Vulnerabilidades encontradas críticas: $CRITICAL; altas: $HIGH; y medias: $MEDIUM;"
              echo "Existen infracciones de niveles Críticas, Altas y/o Medias en el código, se aborta Pipeline en el análisis SCA"
              # exit 1
            fi

# CONSTRUCCIÓN DE IMAGEN 
  DOCKERBUILD:
      needs: SCA
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v2
        
        - name: Descargar Artefacto Build
          uses: actions/download-artifact@master
          with:
              name: build-artifact
              path: .

        - name: Docker Login
          uses: docker/login-action@v3.0.0
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build Imagen Docker
          run: |
            docker build --tag wainerock/devsecopslab-test:latest .

# ESCANEO DE IMAGEN, quiebre de pipeline. 
  SCANIMAGEN:
      needs: DOCKERBUILD
      runs-on: ubuntu-latest
      steps:        
        - name: Docker Login
          uses: docker/login-action@v3.0.0
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Pull Imagen Docker
          run: |
            docker pull wainerock/devsecopslab-test:latest

        - name: Análisis de Imagen con Trivy
          uses: aquasecurity/trivy-action@0.28.0
          with:
            image-ref: wainerock/devsecopslab-test:latest
            format: table
            # exit-code: 1
            # severity: 'CRITICAL,HIGH,MEDIUM'

        - name: Push Docker
          run: |
            docker push wainerock/devsecopslab-test:latest

# DESPLIEGUE. 
  DESPLIEGUE:
      needs: SCANIMAGEN
      runs-on: self-hosted
      steps:
      - name: Eliminar contenedor previo si existe
        run: |
            echo "Eliminando contenedor previo si existe..."
      #       docker rm -f laboratorio-final-deploy

      # - name: Desplegar Aplicación
      #   run: |
      #       echo "Iniciando contenedor..."
      #       docker run -p 3000:3000 --name laboratorio-final-deploy -d wainerock/devsecopslab-test:latest   

# DAST, quiebre de pipeline. 
  DAST:
      needs: DESPLIEGUE
      runs-on: self-hosted
      steps:
      - name: Eliminar contenedor previo si existe
        run: |
            echo "Eliminando contenedor previo si existe..."
            docker rm -f laboratorio-final-deploy

      - name: Desplegar Aplicación
        run: |
            echo "Iniciando contenedor..."
            docker run -p 3000:3000 --name laboratorio-final-deploy -d wainerock/devsecopslab-test:latest   

      # - name: Análisis OWASP ZAP Scan
      #   uses: zaproxy/action-baseline@v0.11.0
      #   with:
      #     target: 'http://localhost:3000'
      #     fail_action: 'false'
      #     cmd_options: '-config replacer.full_list(0).enabled=false'



      - name: Escaneo OWASP ZAP Scan
        run: |
          docker run --network host \
          -v ${{ github.workspace }}:/zap/wrk/:rw \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://localhost:3000 \
          -J report_json.json -w report_md.md -r report_html.html \
          -I


