name: Workflow
on: 
    push:
        branches: 
            - ANALISIS-LAB
jobs: 
    SAST:
        runs-on: ubuntu-latest
        steps: 

            # - name: Set up JDK 17
            #   uses: actions/setup-java@v2
            #   with:
            #     java-version: 17
            #     distribution: 'adopt'
                        
            - name: Checkout code
              uses: actions/checkout@v2
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 18

            - name: Instalando dependencias
              run: npm ci

            - name: Build React
              run: npm run build
                
            - name: Validando proyecto con Sonar
              run: |
                set +e
                curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/projects/create' -d 'name=${{github.event.repository.name}}' -d 'project=${{github.event.repository.name}}' -d 'organization=franciscopainemal' -d 'visibility=public'
                if [ $? -ne 0 ]; then
                    echo "el proyecto ya existe en SonarCloud"
                    echo ":: set-output name=proyectoExiste::1"
                else
                    echo "Proyecto ${{github.event.repository.name}} creado exitosamente con SonarCloud"
                    echo "Se establece rama Main como rama por defecto"
                    curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/project_branches/rename' -d 'name=main' -d 'project=${{ github.event.repository.name }}'                
                fi
                set -e
            -  name: Validando el tipo de proyecto
               run: | 
                    if grep -q '"react"' package.json 
                    then
                        echo "Proyecto es React"
                    else   
                        echo "El proyecto on es del tipp React"
                        exit 1
                    fi



