name: Workflow 
on:
  push: 
    branches: 
      - ANALISIS-LAB

jobs:

# CONTRUCCIÓN BUILD RECURSIVO Y CRACIÓN COMO ARTEFACTO EN GITHUB
  BUILD: 
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v2

        - name: Versión de a utilizar Node.js 18 
          uses: actions/setup-node@v4
          with:
              node-version: 18

        - name: Instalando dependencias
          run: npm ci 
        
        - name: Build del repositorio
          run: npm run build

        - name: Subir build como artefacto para reutilización
          uses: actions/upload-artifact@master
          with:
              name: build-artifact
              path: |
                .next
                public
                package.json

# ANÁLISIS SAST
  SAST:
      needs: BUILD
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v2
        
        - name: Descargar Artefacto Build
          uses: actions/download-artifact@master
          with:
              name: build-artifact
              path: .

        - name: Validando existencia del proyecto en SonarQube
          run: |
            set +e
            curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/projects/create' -d 'name=${{github.event.repository.name}}' -d 'project=${{github.event.repository.name}}' -d 'organization=franciscopainemal' -d 'visibility=public'
            if [ $? -ne 0 ]; 
            then
                echo "el proyecto ya existe en SonarCloud"
                echo ":: set-output name=proyectoExiste::1"
            else
                echo "Proyecto ${{github.event.repository.name}} creado exitosamente con SonarCloud"
                echo "Se establece rama Main como rama por defecto"
                curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/project_branches/rename' -d 'name=main' -d 'project=${{ github.event.repository.name }}'                
            fi
            set -e 

        - name: Validando el tipo de proyecto
          run: | 
            if [ -f "package.json" ]; 
            then    
                if grep -q '"react"' package.json 
                then
                    echo "Proyecto es React."
                else   
                    echo "El proyecto no es del tipp React."
                    exit 1
                fi
            else 
                echo "No se encontró archivo."
                exit 1
            fi

        - name: Ejecutando SONARQUBE
          run: |
            npx sonar-scanner \
              -Dsonar.projectKey=${{ github.event.repository.name }} \
              -Dsonar.organization=franciscopainemal \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
              -Dsonar.branch.name=main

        - name: Validando resultados de SONARQUBE
          run: |
            issuesCritical=$(curl -s -X GET -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/issues/search?branch=main&componentKeys=${{ github.event.repository.name }}&facets=severities' | jq '.facets[0].values[2].count')
            issuesMayor=$(curl -s -X GET -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/issues/search?branch=main&componentKeys=${{ github.event.repository.name }}&facets=severities' | jq '.facets[0].values[1].count')
            issuesMinor=$(curl -s -X GET -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/issues/search?branch=main&componentKeys=${{ github.event.repository.name }}&facets=severities' | jq '.facets[0].values[0].count')
                                        
            if [ "$issuesCritical" -gt 0 ] || [ "$issuesMayor" -gt 0 ] || [ "$issuesMinor" -gt 0 ];
            then
              echo "Existen infracciones de niveles Criticos, Mayores y/o Medios en el código, se aborta Pipeline"
              # exit 1
            fi

# ANÁLISIS SCA, craeción de reporte y quiebre de pipeline 
  SCA:
      needs: SAST
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v2
        
        - name: Descargar Artefacto Build
          uses: actions/download-artifact@master
          with:
              name: build-artifact
              path: .
        
        - name: Dependency Check
          uses: dependency-check/Dependency-Check_Action@1.0.0 
          env: 
            JAVA_HOME: /opt/jdk
          with:
            project: '${{ github.event.repository.name }}'
            path: '.'
            format: 'HTML'
            out: 'reports'
            args: >
              --failOnCVSS 7
              --enableRetired
        - name: Generar reporte de SCA como un repositorio
          uses: actions/upload-artifact@v4
          with:
              name: dependency-check-reports
              path: ${{ github.workspace }}/reports


