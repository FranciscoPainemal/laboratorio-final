name: Workflow 
on:
  push: 
    branches: 
      - ANALISIS-LAB

jobs:

# CONTRUCCIÓN BUILD RECURSIVOY Y CRACIÓN COMO ARTEFACTO EN GITHUB
  BUILD: 
      runs-on: ubuntu-latest
      steps:
        - name: CheckOut Code
          uses: actions/checkout@v2

        - name: Versión de a utilizar Node.js 18 
          uses: actions/setup-node@v4
          with:
              node-version: 18

        - name: Instalando dependencias
          run: npm ci 
        
        - name: Build del reposirotio
          run: npm run build

        - name: Subir build como artefacto
          uses: actions/upload-artifact@v4
          with:
              name: build-artifact
              path: ${{ github.workspace }}/.next

