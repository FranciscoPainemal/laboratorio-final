# ----------------------------  Subir repo a Docker -------------------------------------
    UPLOADDOCKER:
      needs: SCA
      runs-on: ubuntu-latest
      steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar que next esté disponible
        run: npx next --version

      - name: Build de Next.js
        run: npm run build

      - name: Upload Next.js Build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            public
            package.json

# ----------------------------  descargar repo a Docker -------------------------------------
    DOCKERBUILD:
      needs: UPLOADDOCKER
      runs-on: ubuntu-latest
      steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name: Download Next.js Build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .
      
      - name: Docker Login
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build --tag wainerock/devsecopslab-test:latest .

# ----------------------------  Escanear a Docker -------------------------------------
    SCANDOCKER:
      needs: DOCKERBUILD
      runs-on: ubuntu-latest
      steps:

      - name: Docker Login
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Pull
        run: |
          docker pull wainerock/devsecopslab-test:latest
      
      - name: Análisis con Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: wainerock/devsecopslab-test:latest
          format: table
          # exit-code: '1'
          # severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Push docker
        run: |
          docker push wainerock/devsecopslab-test

