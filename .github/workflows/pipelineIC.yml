    DAST:
      needs: SCANDOCKER
      runs-on: ubuntu-latest
      steps:
        - name: Eliminar contenedor previo si existe
          run: |
            echo "Eliminando contenedor previo si existe..."
            docker rm -f laboratorio-final-deploy || true

        - name: Desplegar contenedor de aplicación
          run: |
            echo "Iniciando contenedor..."
            docker run -p 3000:3000 --name laboratorio-final-deploy -d wainerock/devsecopslab-test:latest

        - name: Esperar disponibilidad de la app
          run: |
            echo "Esperando que la app responda..."
            for i in {1..10}; do
              if curl -s http://localhost:3000 > /dev/null; then
                echo "✅ App disponible"
                exit 0
              fi
              echo "⏳ Esperando..."
              sleep 5
            done
            echo "❌ La app no respondió a tiempo"
            exit 1

        - name: Escanear con OWASP ZAP (DAST)
          uses: zaproxy/action-baseline@v0.11.0
          with:
            target: 'http://localhost:3000/'
            fail_action: false
            cmd_options: '-config replacer.full_list(0).enabled=false'

        - name: Eliminar contenedor de aplicación (cleanup)
          if: always()
          run: docker rm -f laboratorio-final-deploy || true
